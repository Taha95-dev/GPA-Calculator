<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator | Track Your Grades</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>📊 GPA Calculator</h1>
        <p class="subtitle">Track your courses and calculate your GPA</p>

        <!-- Add Course Form -->
        <div class="add-course">
            <input type="text" id="courseName" placeholder="Course name (e.g. Math 101)" autocomplete="off">
            <select id="courseGrade">
                <option value="4.0">A (4.0)</option>
                <option value="3.7">A- (3.7)</option>
                <option value="3.3">B+ (3.3)</option>
                <option value="3.0">B (3.0)</option>
                <option value="2.7">B- (2.7)</option>
                <option value="2.3">C+ (2.3)</option>
                <option value="2.0">C (2.0)</option>
                <option value="1.7">C- (1.7)</option>
                <option value="1.3">D+ (1.3)</option>
                <option value="1.0">D (1.0)</option>
                <option value="0.0">F (0.0)</option>
            </select>
            <input type="number" id="courseCredits" placeholder="Credits" value="3" step="1" min="0.5">
            <button id="addBtn">+ Add Course</button>
        </div>

        <!-- Courses List -->
        <div class="courses-section">
            <h2>Your Courses</h2>
            <div id="coursesList" class="courses-list">
                <div class="empty-state">No courses yet. Add one above!</div>
            </div>
        </div>

        <!-- GPA Display -->
        <div class="gpa-section">
            <div class="gpa-card">
                <div class="gpa-label">Your GPA</div>
                <div class="gpa-value" id="gpaValue">0.00</div>
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Total Credits:</span>
                    <span class="stat-value" id="totalCredits">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Grade Points:</span>
                    <span class="stat-value" id="totalPoints">0.00</span>
                </div>
            </div>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="reset-btn">Reset All Courses</button>
    </div>

    <script src="static/index.js"></script>
</body>
</html>
